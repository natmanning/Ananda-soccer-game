<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ananda FC</title>
  <meta name="description" content="A football quiz career for Ananda: levels, stickers, trophies and live stats from Europe's top leagues.">
  <meta name="theme-color" content="#0a1f16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ananda FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="club" id="club"></div>
    <div class="chips">
      <span class="chip" title="Day streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="var(--flame)"/></svg><b id="chip-days">0</b></span>
      <span class="chip" title="Stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="var(--kit)"/></svg><b id="chip-stars">0</b></span>
      <span class="chip" title="Coins"><span class="coin" aria-hidden="true"></span><b id="chip-coins">0</b></span>
      <button class="icon-btn" id="sound" type="button" aria-label="Sound on"></button>
    </div>
  </header>

  <main id="app">
    <section class="screen" id="home"></section>
    <section class="screen" id="level" hidden></section>
    <section class="screen" id="match" hidden></section>
    <section class="screen" id="result" hidden></section>
    <section class="screen" id="shootout" hidden></section>
    <section class="screen" id="live" hidden></section>
    <section class="screen" id="team" hidden></section>
    <section class="screen" id="teampick" hidden></section>
    <section class="screen" id="training" hidden></section>
    <section class="screen" id="album" hidden></section>
    <section class="screen" id="trophies" hidden></section>
    <section class="screen" id="settings" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="questions.js"></script>
  <script src="teams.js"></script>
  <script src="app.js"></script>
</body>
</html>
