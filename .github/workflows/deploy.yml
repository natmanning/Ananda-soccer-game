name: Update stats and deploy

on:
  push:
    branches: [main]
  schedule:
    # Twice a day (05:17 and 17:17 UTC) so tables and headlines stay fresh.
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the stats parser
        run: node --test scripts/fetch-live.test.mjs

      - name: Fetch this season's tables, top scorers and headlines
        run: node scripts/fetch-live.mjs
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
